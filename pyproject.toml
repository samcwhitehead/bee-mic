[project]
authors = [{name = "scw97", email = "samcwhitehead@gmail.com"}]
dependencies = []
name = "bee-mic"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[tool.pixi.pypi-dependencies]
bee_mic = { path = ".", editable = true }

[tool.pixi.tasks]
nb = "jupyter notebook"
test = "pytest tests/"
demo-standard = "python scripts/demo_simulations.py standard"
demo-flyover = "python scripts/demo_simulations.py flyover"
demo-multiple-stationary = "python scripts/demo_simulations.py multiple_stationary"
demo-multiple-moving = "python scripts/demo_simulations.py multiple_moving"
demo-heatmap = "python scripts/demo_simulations.py heatmap"
calibrate = "python scripts/run_calibration.py --rough data/rough_array.json --audio data/raw/calibration/ --out data/calibrated_array.json"
# analyze = "python scripts/analyze_real_data.py"

[tool.pixi.dependencies]
numpy = ">=2.5.3,<3"
scipy = ">=1.18.1,<2"
matplotlib = ">=3.11.2,<4"
pandas = ">=3.0.6,<4"
librosa = ">=1.0.0,<2"
jupyter = ">=1.1.1,<2"
ipykernel = ">=7.4.0,<8"
